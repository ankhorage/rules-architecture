name: Autofix Snapshot

on:
  push:
    branches:
      - feat/1-architecture-detection

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Apply repository fixers
        run: |
          bun run lint:fix || true
          bun run format
      - name: Emit changed files
        shell: bash
        run: |
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            echo "__FILE_START__:${file}"
            base64 -w0 "$file"
            echo
            echo "__FILE_END__:${file}"
          done < <(git diff --name-only)
