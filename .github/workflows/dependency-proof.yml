name: Dependency Proof

on:
  push:
    branches:
      - feat/1-architecture-detection

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Resolve released dependencies
        run: |
          bun install --lockfile-only
          echo '__BUN_LOCK_START__'
          cat bun.lock
          echo '__BUN_LOCK_END__'
